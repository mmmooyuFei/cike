name: cike

services:
  cike:
    build:
      context: .
    image: cike:${CIKE_VERSION:-v1.0.0}
    container_name: ${CIKE_CONTAINER_NAME:-cike}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 9543
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:9543:9543"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9543/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK is required}
    external: true
