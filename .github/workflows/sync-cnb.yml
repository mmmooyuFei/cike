name: Sync to CNB

on:
  push:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-cnb
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Mirror branches and tags to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          [ -n "${CNB_TOKEN:-}" ] || { echo "缺少仓库 secret：CNB_TOKEN" >&2; exit 1; }
          [ -n "${CNB_REPO:-}" ] || { echo "缺少仓库 secret：CNB_REPO" >&2; exit 1; }

          repo="${CNB_REPO#https://}"
          repo="${repo#http://}"
          remote="https://cnb:${CNB_TOKEN}@${repo}"

          git fetch --prune --tags --force origin
          git for-each-ref --format='%(refname)' refs/remotes/origin \
            | grep -v '^refs/remotes/origin/HEAD$' \
            | while IFS= read -r ref; do
                branch="${ref#refs/remotes/origin/}"
                git show-ref --verify --quiet "refs/heads/${branch}" || git branch "${branch}" "${ref}"
              done

          push_refs() {
            for attempt in 1 2 3; do
              git push --force --prune "${remote}" "$@" && return 0
              echo "git push failed (attempt ${attempt}/3), retrying..." >&2
              sleep 5
            done
            return 1
          }

          push_refs --all
          push_refs --tags
          echo "CNB sync completed: $(git rev-parse --short HEAD)"
